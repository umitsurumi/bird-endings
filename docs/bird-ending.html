      html {

      }

      .bird-mark::before,
      .bird-mark::after {
        content: "";
        position: absolute;
        display: block;
      }

      .bird-mark::before {
        left: 12px;
        top: 40px;
        width: 110px;
        height: 54px;

      }

      .bird-mark::after {
        right: 0;
        top: 18px;
        width: 0;
        height: 0;
        border-top: 14px solid transparent;
        border-bottom: 14px solid transparent;
        border-left: 26px solid #d7c05a;

        left: 44px;

            id: "Q10",
            prompt: "你最容易被哪种瞬间打动？",

              { label: "A", text: "看结果吧，我已经选完了。", score: { O: 1 } },
              { label: "B", text: "我想知道这个结果到底准不准。", score: { X: 1, E: 1 } },
              { label: "C", text: "我想发给别人看看他们是什么。", score: { E: 1, S: 1 } },
              { label: "D", text: "我等会儿再看，先去干点别的。", score: { P: 2 } },
            ],
          },
        ];

        const app = document.getElementById("app");
        const statusText = document.getElementById("statusText");
        let statusTimer = null;
        let state = initState();

        render();

        function initState() {
          const result = readStorage(RESULT_KEY);
          if (result && result.result) {
            return { view: "result", currentIndex: 0, answers: {}, result };
          }

          const draft = readStorage(DRAFT_KEY);
          if (draft && draft.answers) {
            return {
              view: "quiz",
              currentIndex: clamp(Number(draft.currentIndex) || 0, 0, QUESTIONS.length - 1),
              answers: draft.answers || {},
              result: null,
            };
          }

          return { view: "home", currentIndex: 0, answers: {}, result: null };
        }

        function render() {
          if (state.view === "home") app.innerHTML = renderHome();
          if (state.view === "quiz") app.innerHTML = renderQuiz();
          if (state.view === "result") app.innerHTML = renderResult();
          if (window.lucide) window.lucide.createIcons();
          bindRenderedEvents();
          updateStatusFromState();
        }

        function bindRenderedEvents() {
          app.querySelectorAll("[data-action]").forEach((button) => {
            button.addEventListener("click", () => {
              if (button.disabled) return;
              handleAction(button.dataset.action);
            });
          });

          app.querySelectorAll("[data-option-label]").forEach((label) => {
            label.addEventListener("click", (event) => {
              event.preventDefault();
              const input = label.querySelector("[data-option]");
              if (input) selectOption(input.value);
            });
          });

          app.querySelectorAll("[data-option]").forEach((input) => {
            input.addEventListener("change", () => selectOption(input.value));
          });
        }

        function handleAction(action) {
          if (action === "start") startNewTest();
          if (action === "resume") resumeDraft();
          if (action === "preview") previewResult();
          if (action === "back") goBack();
          if (action === "next") goNext();
          if (action === "submit") submitResult();
          if (action === "restart") restart();
          if (action === "share") shareResult();
        }

        function selectOption(value) {
          if (state.view !== "quiz") return;
          const question = QUESTIONS[state.currentIndex];
          state.answers[question.id] = value;
          saveDraft();
          setStatus("草稿已保存");
          render();
        }

        function renderHome() {
          return `
            <section class="grid min-h-[calc(100vh-120px)] items-center gap-8 md:grid-cols-[1.05fr_0.95fr]">
              <div class="flex flex-col gap-6">
                <div class="inline-flex w-fit items-center gap-2 rounded-lg border border-moss/20 bg-white px-3 py-2 text-sm font-semibold text-moss">

                </div>
                <div class="flex flex-col gap-4">

                    <i data-lucide="play" class="h-5 w-5" aria-hidden="true"></i>
                    开始测试
                  </button>
                  <button data-action="preview" class="inline-flex min-h-12 items-center justify-center gap-2 rounded-lg border border-ink/15 bg-white px-5 py-3 text-base font-semibold text-ink transition hover:border-moss">
                    <i data-lucide="image" class="h-5 w-5" aria-hidden="true"></i>

              <div class="relative overflow-hidden rounded-lg border border-ink/10 bg-white p-6 shadow-sm">

                    ${metricPill("18", "常规结局")}

                    ${metricPill("6", "隐藏维度")}
                  </div>
                </div>
              </div>
            </section>
            <section class="mt-8 grid gap-4 sm:mt-12">
              <div class="flex flex-col gap-2 sm:flex-row sm:items-end sm:justify-between">
                <div>
                  <p class="text-sm font-semibold text-moss">结果图鉴</p>
                  <h2 class="text-2xl font-bold leading-9 text-ink">18 + 1 种鸟类结局</h2>
                </div>
                <p class="max-w-lg text-sm leading-6 text-ink/60">缩略图直接使用 docs/endings，不用答题也能先检查整体视觉。</p>

                ${BIRD_ORDER.map((bird) => renderGalleryCard(bird)).join("")}
              </div>
            </section>

        }

        function renderGalleryCard(bird) {
          const copy = BIRD_COPY[bird];
          return `
            <article class="overflow-hidden rounded-lg border border-ink/10 bg-white shadow-sm">
              <img src="${copy.image}" alt="${escapeHtml(bird)} 结局示意图" loading="lazy" class="aspect-[720/962] w-full bg-paper object-cover" />
              <div class="grid gap-1 p-3">

        function renderQuiz() {
          const question = QUESTIONS[state.currentIndex];

          return `

              <nav class="grid grid-cols-2 gap-3">
                <button data-action="back" ${state.currentIndex === 0 ? "disabled" : ""} class="inline-flex min-h-12 items-center justify-center gap-2 rounded-lg border border-ink/15 bg-white px-4 py-3 text-base font-semibold text-ink transition hover:border-moss disabled:cursor-not-allowed disabled:opacity-40">

                <button data-action="${isLast ? "submit" : "next"}" ${canContinue ? "" : "disabled"} class="inline-flex min-h-12 items-center justify-center gap-2 rounded-lg bg-moss px-4 py-3 text-base font-semibold text-white transition hover:bg-ink disabled:cursor-not-allowed disabled:bg-ink/25">

        function renderOption(question, option, selected) {
          const id = `${question.id}-${option.label}`;
          return `
            <label for="${id}" class="block cursor-pointer" data-option-label>
              <input id="${id}" class="option-input sr-only" type="radio" name="${question.id}" value="${option.label}" data-option ${selected === option.label ? "checked" : ""} />
              <span class="option-box grid min-h-[76px] grid-cols-[44px_1fr] items-center gap-3 rounded-lg border border-ink/10 bg-paper/50 p-3 transition hover:border-moss/50 sm:min-h-[72px]">
                <span class="grid h-11 w-11 place-items-center rounded-lg bg-white text-sm font-bold text-moss">${option.label}</span>

        function renderResult() {
          const result = state.result || readStorage(RESULT_KEY);
          const copy = BIRD_COPY[result.result] || BIRD_COPY["鸽子"];
          const clarity = result.isEasterEgg ? "彩蛋" : clarityLabel(result.clarity);
          const second = result.secondRegularResult ? `你身上还藏着「${result.secondRegularResult}」的影子。` : "";
          return `
            <section class="mx-auto grid w-full max-w-6xl gap-6 lg:grid-cols-[0.86fr_1.14fr] lg:items-start">
              <div class="overflow-hidden rounded-lg border border-ink/10 bg-white shadow-sm">
                <div class="bg-ink p-2">
                  <img src="${copy.image}" alt="${escapeHtml(result.result)} 结局示意图" class="aspect-[720/962] w-full rounded-md bg-paper object-cover" />
                </div>
                <div class="grid grid-cols-2 gap-3 p-4">
                  ${metricPill(clarity, "清晰度")}
                  ${metricPill(result.isEasterEgg ? "是" : "否", "彩蛋")}
                  ${metricPill(formatDistance(result.bestDistance), "最近距离")}
                  ${metricPill(formatDistance(result.distanceGap), "距离差")}
                </div>
              </div>

              <div id="result-card" class="rounded-lg border border-ink/10 bg-white p-5 shadow-sm sm:p-7">
                <div class="mb-5 inline-flex items-center gap-2 rounded-lg bg-berry/10 px-3 py-2 text-sm font-semibold text-berry">
                  <i data-lucide="${result.isEasterEgg ? "sparkles" : "badge-check"}" class="h-4 w-4" aria-hidden="true"></i>
                  ${escapeHtml(copy.tag)}
                </div>
                <p class="mb-3 text-sm font-semibold text-moss">${result.isEasterEgg ? "你触发了隐藏结局" : clarityMessage(result)}</p>
                <h1 class="mb-4 text-4xl font-bold leading-[1.12] text-ink sm:text-5xl">${escapeHtml(result.result)}</h1>
                <p class="text-base leading-8 text-ink/75 sm:text-lg">${escapeHtml(copy.text)}</p>
                ${second && !result.isEasterEgg ? `<p class="mt-5 rounded-lg border border-sky/40 bg-sky/15 p-4 text-sm font-medium leading-7 text-ink/75">${escapeHtml(second)}</p>` : ""}
                <div class="mt-6 grid gap-3 sm:grid-cols-2">
                  <button data-action="share" class="inline-flex min-h-12 items-center justify-center gap-2 rounded-lg bg-moss px-4 py-3 text-base font-semibold text-white transition hover:bg-ink">
                    <i data-lucide="share-2" class="h-5 w-5" aria-hidden="true"></i>
                    分享结果
                  </button>
                  <button data-action="restart" class="inline-flex min-h-12 items-center justify-center gap-2 rounded-lg border border-ink/15 bg-white px-4 py-3 text-base font-semibold text-ink transition hover:border-moss">
                    <i data-lucide="rotate-ccw" class="h-5 w-5" aria-hidden="true"></i>
                    重新开始
                  </button>
                </div>
                <details class="mt-6 rounded-lg border border-ink/10 bg-paper/50 p-4">
                  <summary class="cursor-pointer text-sm font-semibold text-ink">维度画像</summary>
                  <div class="mt-4 grid gap-3">
                    ${DIMENSIONS.map((dim) => renderDimensionBar(dim, result.normalizedScores[dim], result.rawScores[dim])).join("")}
                  </div>
                </details>
              </div>
            </section>
          `;
        }

        function renderDimensionBar(dim, normalized, raw) {
          const percent = ((normalized + 2) / 4) * 100;
          return `
            <div class="grid gap-2">
              <div class="flex items-center justify-between text-sm">
                <span class="font-semibold text-ink">${DIM_LABELS[dim]}</span>
                <span class="text-ink/60">raw ${raw} · norm ${normalized}</span>
              </div>
              <div class="h-2 overflow-hidden rounded-lg bg-white">
                <div class="h-full rounded-lg bg-berry" style="width: ${percent}%"></div>
              </div>
            </div>
          `;
        }

        function metricPill(value, label) {
          return `
            <div class="rounded-lg border border-ink/10 bg-paper/70 p-4">
              <p class="text-2xl font-bold leading-8 text-ink">${value}</p>
              <p class="text-xs font-semibold leading-5 text-ink/55">${label}</p>
            </div>
          `;
        }

        function startNewTest() {
          clearStorage();
          state = { view: "quiz", currentIndex: 0, answers: {}, result: null };
          saveDraft();
          render();
        }

        function resumeDraft() {
          const draft = readStorage(DRAFT_KEY);
          if (!draft) return startNewTest();
          state = {
            view: "quiz",
            currentIndex: clamp(Number(draft.currentIndex) || 0, 0, QUESTIONS.length - 1),
            answers: draft.answers || {},
            result: null,
          };
          render();
        }

        function previewResult() {
          const bird = BIRD_ORDER[Math.floor(Math.random() * BIRD_ORDER.length)];
          const isEasterEgg = bird === "鸽子";
          const result = {
            result: bird,
            isEasterEgg,
            bestRegularResult: isEasterEgg ? "麻雀" : bird,
            secondRegularResult: isEasterEgg ? "燕子" : "喜鹊",
            bestDistance: isEasterEgg ? 6.2 : 3.4,
            secondDistance: isEasterEgg ? 6.8 : 4.7,
            distanceGap: isEasterEgg ? 0.6 : 1.3,
            clarity: isEasterEgg ? "low" : "medium",
            rawScores: { S: 0, M: 0, E: 0, A: 0, O: 0, X: 0, P: isEasterEgg ? 3 : 0 },
            normalizedScores: { S: 0, M: 0, E: 0, A: 0, O: 0, X: 0 },
            answers: {},
            submittedAt: new Date().toISOString(),
            isPreview: true,
          };
          state = { view: "result", currentIndex: 0, answers: {}, result };
          setStatus("预览结果页");
          render();
        }

        function goBack() {
          if (state.currentIndex <= 0) return;
          state.currentIndex -= 1;
          saveDraft();
          render();
        }

        function goNext() {
          const question = QUESTIONS[state.currentIndex];
          if (!state.answers[question.id]) return;
          state.currentIndex = clamp(state.currentIndex + 1, 0, QUESTIONS.length - 1);
          saveDraft();
          render();
        }

        function submitResult() {
          if (!allAnswered()) {
            setStatus("还有题目未选择");
            return;
          }
          const result = calculateResult(state.answers);
          writeStorage(RESULT_KEY, result);
          removeStorage(DRAFT_KEY);
          state = { view: "result", currentIndex: 0, answers: {}, result };
          setStatus("结果已生成");
          render();
        }

        function restart() {
          clearStorage();
          state = { view: "home", currentIndex: 0, answers: {}, result: null };
          render();
        }

        async function shareResult() {
          const result = state.result || readStorage(RESULT_KEY);
          if (!result) return;
          const text = `我的鸟类转生结局是：${result.result}。`;
          try {
            if (navigator.share) {
              await navigator.share({ title: "鸟类转生测试", text });
              setStatus("已打开分享");
            } else {
              await copyText(text);
              setStatus("结果已复制");
            }
          } catch (error) {
            setStatus("分享已取消");
          }
        }

        function calculateResult(answers) {
          const rawScores = calculateRawScores(answers);
          const normalizedScores = {};
          DIMENSIONS.forEach((dim) => {
            normalizedScores[dim] = normalizeScore(dim, rawScores[dim]);
          });

          const ranked = rankBirds(normalizedScores);
          const best = ranked[0];
          const second = ranked[1];
          const distanceGap = second.distance - best.distance;
          const pTotal = rawScores.P;
          const isLowClarity = distanceGap <= 1 || best.distance >= 6;
          const isPigeon = pTotal >= 3 || (pTotal === 2 && isLowClarity);
          const clarity = getClarity(best.distance, distanceGap);

          return {
            result: isPigeon ? "鸽子" : best.bird,
            isEasterEgg: isPigeon,
            bestRegularResult: best.bird,
            secondRegularResult: second.bird,
            bestDistance: best.distance,
            secondDistance: second.distance,
            distanceGap,
            clarity,
            rawScores,
            normalizedScores,
            answers,
            submittedAt: new Date().toISOString(),
          };
        }

        function calculateRawScores(answers) {
          const scores = { S: 0, M: 0, E: 0, A: 0, O: 0, X: 0, P: 0 };
          QUESTIONS.forEach((question) => {
            const selected = answers[question.id];
            const option = question.options.find((item) => item.label === selected);
            if (!option) return;
            Object.entries(option.score).forEach(([dim, value]) => {
              scores[dim] += value;
            });
          });
          return scores;
        }

        function normalizeScore(dim, raw) {
          const range = RANGES[dim];
          const norm = Math.round(((raw - range.min) / (range.max - range.min)) * 4 - 2);
          return clamp(norm, -2, 2);
        }

        function rankBirds(userProfile) {
          return Object.entries(BIRD_PROFILES)
            .map(([bird, profile]) => ({
              bird,
              distance: weightedDistance(userProfile, profile),
              uniqueness: calculateUniqueness(bird),
              priority: FALLBACK_INDEX.get(bird) ?? 999,
            }))
            .sort((left, right) => {
              if (Math.abs(left.distance - right.distance) > 0.00001) return left.distance - right.distance;
              if (Math.abs(left.uniqueness - right.uniqueness) > 0.00001) return right.uniqueness - left.uniqueness;
              return left.priority - right.priority;
            });
        }

        function weightedDistance(left, right) {
          return DIMENSIONS.reduce((distance, dim) => {
            return distance + WEIGHTS[dim] * Math.abs(left[dim] - right[dim]);
          }, 0);
        }

        function calculateUniqueness(bird) {
          const target = BIRD_PROFILES[bird];
          const distances = Object.entries(BIRD_PROFILES)
            .filter(([name]) => name !== bird)
            .map(([, profile]) => weightedDistance(target, profile));
          return distances.reduce((sum, value) => sum + value, 0) / distances.length;
        }

        function getClarity(bestDistance, distanceGap) {
          if (distanceGap >= 1.5 && bestDistance < 6) return "high";
          if (distanceGap > 1 && bestDistance < 6) return "medium";
          return "low";
        }

        function clarityLabel(clarity) {
          if (clarity === "high") return "高";
          if (clarity === "medium") return "中";
          return "低";
        }

        function clarityMessage(result) {
          if (result.clarity === "high") return `你的结果非常明确：你转生成了${result.result}`;
          if (result.clarity === "medium") return `你的结果偏向${result.result}，但也带有一些其他鸟类的影子`;
          return `你的特质跨在几种鸟之间，但最终你转生成了${result.result}`;
        }

        function allAnswered() {
          return QUESTIONS.every((question) => state.answers[question.id]);
        }

        function saveDraft() {
          writeStorage(DRAFT_KEY, {
            currentIndex: state.currentIndex,
            answers: state.answers,
            updatedAt: new Date().toISOString(),
          });
        }

        function updateStatusFromState() {
          if (statusTimer) return;
          if (state.view === "result") {
            statusText.textContent = "结果已生成";
            return;
          }
          if (state.view === "quiz") {
            statusText.textContent = "草稿暂存中";
            return;
          }
          statusText.textContent = "准备开始";
        }

        function setStatus(text) {
          statusText.textContent = text;
          window.clearTimeout(statusTimer);
          statusTimer = window.setTimeout(() => {
            statusTimer = null;
            updateStatusFromState();
          }, 1600);
        }

        function readStorage(key) {
          try {
            return JSON.parse(localStorage.getItem(key));
          } catch (error) {
            return null;
          }
        }

        function writeStorage(key, value) {
          try {
            localStorage.setItem(key, JSON.stringify(value));
          } catch (error) {
            setStatus("本地存储不可用");
          }
        }

        function removeStorage(key) {
          try {
            localStorage.removeItem(key);
          } catch (error) {}
        }

        function clearStorage() {
          removeStorage(DRAFT_KEY);
          removeStorage(RESULT_KEY);
        }

        function copyText(text) {
          if (navigator.clipboard && window.isSecureContext) {
            return navigator.clipboard.writeText(text);
          }
          const textarea = document.createElement("textarea");
          textarea.value = text;
          textarea.setAttribute("readonly", "");
          textarea.style.position = "fixed";
          textarea.style.left = "-9999px";
          document.body.appendChild(textarea);
          textarea.select();
          document.execCommand("copy");
          textarea.remove();
          return Promise.resolve();
        }

        function formatDistance(value) {
          if (typeof value !== "number") return "-";
          return Number.isInteger(value) ? String(value) : value.toFixed(1);
        }

        function clamp(value, min, max) {
          return Math.min(max, Math.max(min, value));
        }

        function escapeHtml(value) {
          return String(value)
            .replaceAll("&", "&amp;")
            .replaceAll("<", "&lt;")
            .replaceAll(">", "&gt;")
            .replaceAll('"', "&quot;")
            .replaceAll("'", "&#039;");
        }
      })();
    </script>
  </body>
</html>
